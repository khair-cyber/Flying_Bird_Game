<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khair Project-Flying Bird Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }

        #videoBackground {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 1;
        }

        #gameCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 2;
        }

        #ui {
            position: absolute;
            top: 30px; left: 30px;
            color: #fff;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 2px 2px 15px rgba(0,0,0,1);
            z-index: 10;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 100;
            text-align: center;
            padding: 20px;
        }

        button {
            background: #f1c40f;
            border: none;
            padding: 18px 45px;
            font-size: 22px;
            font-weight: bold;
            color: #222;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(241, 196, 15, 0.4);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="ui">SKOR: 0</div>
    <video id="videoBackground" autoplay playsinline muted></video>
    <canvas id="gameCanvas"></canvas>

    <div id="startScreen" class="overlay">
        <h1>🦅 FLYING BIRD</h1>
        <p style="margin: 15px 0;">Gunakan jari/tangan di sisi <b>Kanan</b> layar untuk mengontrol burung.</p>
        <button onclick="startApp()">MULAI GAME</button>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
        <h1 style="color: #ff4757; font-size: 60px;">GAME OVER!</h1>
        <p id="finalScoreText" style="font-size: 28px;">Skor: 0</p>
        <button onclick="resetGame()">COBA LAGI</button>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('videoBackground');
    const scoreUI = document.getElementById('ui');

    let gameRunning = false;
    let score = 0;
    let birdY = window.innerHeight / 2;
    let targetY = window.innerHeight / 2;
    let pipes = [];
    let frameCount = 0;
    let w, h;
    let fingerPos = { x: 0, y: 0, detected: false };

    // --- 1. INISIALISASI AUDIO EKSTERNAL ---
    const sndScore = new Audio('score.mp3');
    const sndFlap = new Audio('flap.mp3');
    const sndGameOver = new Audio('gameover.mp3');

    function playSnd(sound) {
        sound.currentTime = 0; // Reset ke awal agar bisa bunyi berulang cepat
        sound.play().catch(e => console.log("Audio diblokir browser, klik layar dulu."));
    }

    // Canvas kecil untuk proses deteksi (performa)
    const pCanvas = document.createElement('canvas');
    const pCtx = pCanvas.getContext('2d', { willReadFrequently: true });
    pCanvas.width = 120; 
    pCanvas.height = 90;

    function resize() {
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = w;
        canvas.height = h;
    }
    window.addEventListener('resize', resize);
    resize();

    async function startApp() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } } 
            });
            video.srcObject = stream;
            document.getElementById('startScreen').classList.add('hidden');
            
            // Resume audio context jika diperlukan (untuk browser tertentu)
            gameRunning = true;
            requestAnimationFrame(gameLoop);
            processDetection();
        } catch (err) {
            alert("Kamera tidak ditemukan atau izin ditolak.");
        }
    }

    function processDetection() {
        if (!gameRunning) return;

        pCtx.save();
        pCtx.scale(-1, 1);
        pCtx.drawImage(video, -pCanvas.width, 0, pCanvas.width, pCanvas.height);
        pCtx.restore();

        const data = pCtx.getImageData(0, 0, pCanvas.width, pCanvas.height).data;
        let topY = -1;
        let avgX = 0;
        let count = 0;

        const scanLimit = Math.floor(pCanvas.width * 0.6); 

        for (let y = 0; y < pCanvas.height; y++) {
            for (let x = scanLimit; x < pCanvas.width; x++) {
                const i = (y * pCanvas.width + x) * 4;
                const r = data[i], g = data[i+1], b = data[i+2];

                // Filter warna kulit sederhana
                if (r > 90 && g > 40 && r > g && (r - g) > 20) {
                    if (topY === -1) topY = y;
                    avgX += x;
                    count++;
                }
            }
        }

        if (count > 8) {
            let oldTargetY = targetY;
            targetY = (topY / pCanvas.height) * h;
            
            // --- 2. SUARA FLAP (Saat tangan bergerak naik cepat) ---
            if (oldTargetY - targetY > 12) {
                playSnd(sndFlap);
            }

            fingerPos.x = ((avgX / count) / pCanvas.width) * w;
            fingerPos.y = targetY;
            fingerPos.detected = true;
        } else {
            fingerPos.detected = false;
        }

        setTimeout(processDetection, 30); 
    }

    function update() {
        frameCount++;
        birdY += (targetY - birdY) * 0.2; // Kehalusan gerakan burung

        // Munculkan pipa setiap 90 frame
        if (frameCount % 90 === 0) {
            const gap = h * 0.32;
            const topH = Math.random() * (h - gap - 200) + 100;
            pipes.push({ x: w, top: topH, gap: gap, passed: false });
        }

        for (let i = pipes.length - 1; i >= 0; i--) {
            pipes[i].x -= 7;
            
            // Logika Tabrakan
            if (w*0.2 + 25 > pipes[i].x && w*0.2 - 25 < pipes[i].x + 90) {
                if (birdY - 20 < pipes[i].top || birdY + 20 > pipes[i].top + pipes[i].gap) {
                    gameOverEffect();
                    return;
                }
            }

            // --- 3. SUARA SCORE (Saat melewati pipa) ---
            if (!pipes[i].passed && pipes[i].x < w*0.2) {
                pipes[i].passed = true;
                score++;
                scoreUI.innerText = "SKOR: " + score;
                playSnd(sndScore);
            }

            // Hapus pipa yang sudah lewat
            if (pipes[i].x < -100) pipes.splice(i, 1);
        }

        // Batas atas bawah
        if (birdY < 0 || birdY > h) {
            gameOverEffect();
        }
    }

    function draw() {
        ctx.clearRect(0, 0, w, h);

        // Garis batas deteksi
        ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
        ctx.setLineDash([5, 5]);
        ctx.beginPath(); ctx.moveTo(w*0.6, 0); ctx.lineTo(w*0.6, h); ctx.stroke();
        ctx.setLineDash([]);

        // Gambar Pipa
        ctx.fillStyle = "#2ecc71";
        pipes.forEach(p => {
            ctx.fillRect(p.x, 0, 90, p.top);
            ctx.fillRect(p.x, p.top + p.gap, 90, h);
            ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
            ctx.strokeRect(p.x, 0, 90, p.top);
            ctx.strokeRect(p.x, p.top + p.gap, 90, h);
        });

        // Gambar Burung (Kuning)
        ctx.save();
        ctx.translate(w * 0.2, birdY);
        ctx.fillStyle = "#f1c40f";
        ctx.beginPath(); ctx.arc(0, 0, 25, 0, Math.PI*2); ctx.fill();
        ctx.lineWidth = 4; ctx.strokeStyle = "#fff"; ctx.stroke();
        ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(12, -8, 5, 0, Math.PI*2); ctx.fill();
        ctx.restore();

        // Penanda posisi tangan
        if (fingerPos.detected) {
            ctx.fillStyle = "rgba(241, 196, 15, 0.5)";
            ctx.beginPath(); ctx.arc(fingerPos.x, fingerPos.y, 15, 0, Math.PI*2); ctx.fill();
        }
    }

    // --- 4. SUARA GAME OVER ---
    function gameOverEffect() {
        gameRunning = false;
        playSnd(sndGameOver); 
        document.getElementById('finalScoreText').innerText = "Skor Akhir: " + score;
        document.getElementById('gameOverScreen').classList.remove('hidden');
    }

    function gameLoop() {
        if (!gameRunning) return;
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    function resetGame() {
        score = 0; pipes = []; frameCount = 0;
        scoreUI.innerText = "SKOR: 0";
        document.getElementById('gameOverScreen').classList.add('hidden');
        gameRunning = true;
        birdY = h / 2;
        targetY = h / 2;
        requestAnimationFrame(gameLoop);
        processDetection();
    }
</script>
</body>
</html>
